<!DOCTYPE html>
<html lang="en" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weekly Meal Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/firebase@13.2.0/firebase-app-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@13.2.0/firebase-auth-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/firebase@13.2.0/firebase-firestore-compat.js"></script>
<style>
:root{
  --ink:#1E2430; --muted:#656B75; --navy:#1F3A5F; --blue:#2E5A8A;
  --box:#EAF1F8; --box-line:#C9D5E3; --line:#D0D7DE; --line2:#E3E6EB;
  --bg:#FFFFFF; --surface:#FFFFFF; --today:#FFF6E0; --today-line:#DBC490;
  --ok:#2E7D4F; --ok-bg:#DCEFE3; --warn:#9A6A00; --warn-bg:#FFE9C2; --bad:#B23B3B; --bad-bg:#F6D6D6;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans",system-ui,sans-serif;font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1320px;margin:0 auto;padding:14px 28px 48px}
.mono{font-family:"IBM Plex Mono",monospace}
.verline{display:flex;justify-content:flex-end;font-size:11.5px;color:var(--muted)}
.verline b{color:var(--ink)}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;border-bottom:2px solid var(--navy);padding:6px 0 10px;margin-bottom:14px}
.kicker{font-size:12px;color:var(--muted)}
h1{margin:2px 0 2px;font-size:26px;color:var(--navy);font-weight:700;letter-spacing:-.2px}
.sub{color:var(--blue);font-weight:600}
.owner-area{display:flex;align-items:center;gap:8px}
.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:12px;font-weight:600}
.tag.ok{background:var(--ok-bg);color:var(--ok)} .tag.warn{background:var(--warn-bg);color:var(--warn)} .tag.bad{background:var(--bad-bg);color:var(--bad)}
.btn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--blue);color:var(--blue)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.primary:hover{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.danger{color:var(--bad);border-color:#E7B7B7}
.ytbtn{display:inline-flex;align-items:center;gap:6px;margin:0 0 10px;padding:8px 14px;background:#CC0000;color:#fff!important;border-radius:6px;font-weight:600;font-size:14px;text-decoration:none}
.ytbtn:hover{background:#A80000}
.aibtn{border-color:#C9B8F0;color:#5B3FC4;background:#F6F2FF}.aibtn:hover{border-color:#5B3FC4;color:#5B3FC4}
.aihint{margin:0 0 8px;padding:7px 10px;border-radius:6px;background:#F6F2FF;border:1px solid #DCD0FA;color:#4A3699;font-size:13px}
.ytrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.ytrow input{flex:1;min-width:220px}
.ytres{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin-top:8px}
.ytres button{border:2px solid var(--line);border-radius:6px;background:#fff;padding:0;cursor:pointer;text-align:left;overflow:hidden;font:inherit}
.ytres button:hover{border-color:var(--blue)}.ytres button.on{border-color:#CC0000;box-shadow:0 0 0 3px #F6D6D6}
.ytres img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:var(--box)}
.ytres .t{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:12px;font-weight:600;padding:4px 6px 0;line-height:1.3}
.ytres .c{display:block;font-size:11px;color:var(--muted);padding:0 6px 5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iedit{border:1px solid var(--box-line);background:#fff;border-radius:4px;font-size:11px;padding:0 6px;margin-left:6px;color:var(--blue);cursor:pointer;vertical-align:1px}
.addrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 12px;background:#FAFBFC;border-top:1px dashed var(--line)}
.addrow .ar-l{font-size:12.5px;font-weight:600;color:var(--blue);margin-right:4px}
.addrow input{padding:5px 8px;border:1px solid var(--line);border-radius:4px;font-size:13px}
.addrow .ar-n{flex:1;min-width:120px}.addrow .ar-u{width:100px}.addrow .ar-p{width:70px}
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:#F4F6F9}
.gcard{width:100%;max-width:380px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:26px 24px;box-shadow:0 6px 24px rgba(20,40,80,.08)}
.gcard h1{font-size:22px;margin:0 0 4px;color:var(--navy)}.gcard .gs{color:var(--muted);font-size:13px;margin-bottom:18px}
.gcard label{display:block;font-size:12.5px;font-weight:600;margin:10px 0 4px}
.gcard input{width:100%;box-sizing:border-box;padding:10px;font-size:15px;border:1px solid var(--line);border-radius:6px}
.gcard .btn{width:100%;padding:10px;margin-top:12px;font-size:14.5px}.gcard .msg{margin-top:10px;font-size:13px;line-height:1.5}
.gcard .gbtn{display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;border:1px solid #C9CED6;font-weight:600;margin-top:4px}
.gcard .gbtn:hover{background:#F6F8FA}
.gcard .gor{text-align:center;color:var(--muted);font-size:12px;margin:14px 0 0}
.gcard .gv{text-align:right;font-size:11px;color:var(--muted);margin:-12px -10px 10px 0}
.tbl{border-collapse:collapse;font-size:13px}.tbl th,.tbl td{border-bottom:1px solid var(--box-line);padding:6px 4px;text-align:left}
.btn.sm{padding:3px 9px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:default}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.tabs{display:flex;gap:4px}
.tab{border:1px solid var(--line);background:#fff;padding:7px 16px;border-radius:6px;cursor:pointer;font-weight:600;color:var(--muted)}
.tab.on{background:var(--navy);border-color:var(--navy);color:#fff}
.weeknav{display:flex;align-items:center;gap:6px}
.weeknav .range{min-width:190px;text-align:center;font-weight:600;color:var(--navy)}
.secbar{background:var(--navy);color:#fff;font-weight:700;padding:7px 12px;border-radius:3px;margin:18px 0 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.secbar .r{font-weight:400;font-size:12.5px;opacity:.9}
.notebox{background:var(--box);border:1px solid var(--box-line);border-radius:4px;padding:10px 14px;margin-bottom:6px}
.notebox .h{font-weight:700;color:var(--navy);margin-bottom:2px}
.notebox textarea{width:100%;min-height:54px;border:1px solid var(--box-line);border-radius:4px;padding:6px 8px;background:#fff;resize:vertical}
.empty{color:var(--muted);font-style:italic}
/* plan grid */
.grid{display:grid;grid-template-columns:92px repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:4px;overflow:hidden}
.grid > div{border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);padding:8px;min-height:44px}
.grid > div:nth-child(8n){border-right:0}
.gh{background:var(--box);font-weight:700;color:var(--navy);text-align:center;padding:8px 4px!important}
.gh .d{display:block;font-size:12px;color:var(--muted);font-weight:500}
.gh.today{background:var(--today);color:var(--warn)}
.gl{background:var(--box);font-weight:700;color:var(--navy);display:flex;align-items:center}
.cell.today{background:#FFFBF0}
.gh.sun{background:#FCEDED;color:#C0392B}.gh.sat{background:#E9F0FB;color:#1F5FBF}
.gh.sun .d{color:#C0392B}.gh.sat .d{color:#1F5FBF}
.cell.sun{background:#FFF8F8}.cell.sat{background:#F5F8FE}
.gh.today.sun,.gh.today.sat{background:var(--today)}.cell.today.sun,.cell.today.sat{background:#FFFBF0}
.chip{display:flex;align-items:center;gap:6px;border:1px solid var(--box-line);background:#fff;border-radius:5px;padding:4px 7px;margin-bottom:5px;font-size:13px;line-height:1.3}
.chip .nm{flex:1;min-width:0;cursor:pointer;color:var(--ink);overflow-wrap:break-word;hyphens:auto}
.chip .nm.link:hover{color:var(--blue);text-decoration:underline}
.chip .n1{display:block;font-weight:600;color:var(--ink)}.chip .n2{display:block;font-size:11.5px;color:var(--muted);font-weight:400}
.chip .nt{display:block;font-size:11.5px;color:var(--muted);font-style:italic}
.grid .chip .nm{min-height:50px}
.grid .chip .n1{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.grid .chip .n2,.grid .chip .nt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip .x{border:0;background:none;color:var(--muted);cursor:pointer;padding:0 2px;font-size:14px;line-height:1}
.chip .x:hover{color:var(--bad)}
.addlink{border:1px dashed var(--box-line);background:none;color:var(--blue);border-radius:5px;width:100%;padding:3px;cursor:pointer;font-size:12.5px}
.daycards{display:none}
/* shopping */
.shopcols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
.shopgrp{border:1px solid var(--line);border-radius:4px;overflow:hidden}
.shopgrp .gt{background:var(--box);border-bottom:1px solid var(--line);padding:7px 12px;font-weight:700;color:var(--navy);display:flex;justify-content:space-between}
.shopgrp .gt span{font-weight:500;color:var(--muted);font-size:12px}
.sitem{display:flex;gap:10px;align-items:flex-start;padding:7px 12px;border-bottom:1px solid var(--line2);cursor:pointer}
.sitem:last-child{border-bottom:0}
.sitem input{margin-top:3px;width:17px;height:17px;accent-color:var(--navy);cursor:pointer;flex:none}
.sitem .t{flex:1}
.sitem .q{font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--blue);white-space:nowrap}
.sitem .f{display:block;font-size:11.5px;color:var(--muted)}
.xdel{border:0;background:none;color:var(--muted);cursor:pointer;font-size:15px;padding:0 2px;line-height:1}.xdel:hover{color:var(--bad)}
.sitem.done .t .n,.sitem.done .q{text-decoration:line-through;color:var(--muted)}
.progress{height:8px;background:var(--line2);border-radius:4px;overflow:hidden;width:220px}
.progress > i{display:block;height:100%;background:var(--ok)}
.extraform{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.extraform input,.extraform select{border:1px solid var(--line);border-radius:5px;padding:5px 8px}
/* recipes */
.rfilter{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.rfilter input{border:1px solid var(--line);border-radius:6px;padding:6px 10px;width:240px}
.pill{border:1px solid var(--line);background:#fff;border-radius:14px;padding:4px 12px;cursor:pointer;font-size:12.5px}
.pill.on{background:var(--box);border-color:var(--box-line);color:var(--navy);font-weight:700}
.rgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.rcard{border:1px solid var(--line);border-top:3px solid var(--navy);border-radius:5px;cursor:pointer;background:#fff;display:flex;flex-direction:column;overflow:hidden}
.rcard:hover{border-color:var(--blue)}
.rcard .rb{padding:9px 12px 11px;display:flex;flex-direction:column;gap:4px}
.rph{width:100%;height:150px;object-fit:cover;display:block;background:var(--box)}
.rph.none{display:flex;align-items:center;justify-content:center;color:#9AA4B2;font-size:12px}
.mphoto{width:100%;max-height:340px;object-fit:cover;border-radius:6px;margin-bottom:12px;display:block}
.pprev{width:160px;height:110px;object-fit:cover;border-radius:5px;border:1px solid var(--line)}
.shopcols2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;align-items:start}
.brow{display:grid;grid-template-columns:26px minmax(0,1fr) 84px 124px 84px;gap:8px;align-items:center;padding:7px 12px;border-bottom:1px solid var(--line2)}
.brow:last-child{border-bottom:0}
.brow.bh{font-size:11.5px;color:var(--muted);font-weight:600;padding:5px 12px;background:#FAFBFC}
.brow .n{display:block}.brow .f,.srow .f{display:block;font-size:11.5px;color:var(--muted)}
.c-need,.c-buy{font-size:12.5px;text-align:right;font-family:"IBM Plex Mono",monospace}
.c-buy{color:var(--blue);font-weight:600}
.bought{width:18px;height:18px;accent-color:var(--navy);cursor:pointer}
.stkw{display:flex;align-items:center;gap:4px;justify-content:flex-end}
.stk{width:66px;border:1px solid var(--line);border-radius:5px;padding:3px 6px;text-align:right;font-family:"IBM Plex Mono",monospace;font-size:12.5px}
.stkw .u{font-size:11.5px;color:var(--muted);min-width:34px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;flex:none}
.seg button{border:0;border-right:1px solid var(--line);background:#fff;padding:4px 10px;font-size:12px;cursor:pointer;color:var(--muted)}
.seg button:last-child{border-right:0}
.seg .on.ok{background:var(--ok-bg);color:var(--ok);font-weight:700}.seg .on.low{background:var(--warn-bg);color:var(--warn);font-weight:700}.seg .on.out{background:var(--bad-bg);color:var(--bad);font-weight:700}
.srow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:7px 12px;border-bottom:1px solid var(--line2)}
.srow:last-child{border-bottom:0}.srow .n{display:block}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
.two .secbar{margin-top:0}
.two .shopgrp{margin-bottom:12px}
.brow.r5{grid-template-columns:26px minmax(0,1fr) 74px 84px 74px}
.wk{display:inline-block;background:var(--box);color:var(--blue);border:1px solid var(--box-line);font-size:10.5px;font-weight:600;padding:0 5px;border-radius:3px;margin-left:4px;vertical-align:1px}
.thumb{width:40px;height:40px;border-radius:6px;background:var(--box);border:1px solid var(--box-line);display:inline-flex;align-items:center;justify-content:center;font-size:21px;line-height:1;overflow:hidden;flex:none}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb.edit,.thumb.view{cursor:pointer}.thumb.edit:hover{border-color:var(--blue)}
.sl{display:flex;gap:10px;align-items:center;min-width:0}
.modal.wide{max-width:980px}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:8px}
.palc{border:1px solid var(--line);border-radius:7px;background:#fff;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;user-select:none}
.palc[draggable=true]{cursor:grab}.palc:hover{border-color:var(--blue)}
.palc .pkimg{height:62px;font-size:32px}
.palc .pkn{padding:5px 7px 7px;line-height:1.25}
.palc .n1{display:block;font-weight:600;font-size:12.5px;color:var(--navy)}.palc .n2{display:block;font-size:10.5px;color:var(--muted)}
.chip[draggable=true]{cursor:grab}
.palc{position:relative}.palc.on{border:2px solid var(--navy);box-shadow:0 0 0 3px var(--box-line)}
.palinfo{position:absolute;top:5px;right:5px;border:1px solid var(--box-line);background:#fff;border-radius:4px;font-size:10.5px;padding:1px 6px;cursor:pointer;color:var(--blue)}
.pickbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;background:var(--navy);color:#fff;padding:8px 12px;border-radius:6px;margin-bottom:10px;font-size:13.5px}
.pickbar .btn{margin-left:auto}
.picking [data-d][data-s]{cursor:copy;background:#F3F8FF}
.picking .addlink{border-color:var(--blue);color:var(--blue);font-weight:600}
.picking [data-d][data-s]:hover{outline:2px dashed var(--blue);outline-offset:-3px}
.dragging{opacity:.45}
.dropok{outline:2px dashed var(--blue);outline-offset:-3px;background:#EEF4FF!important}
.pk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;max-height:52vh;overflow:auto;padding:3px}
.pk{border:2px solid var(--line);border-radius:8px;background:#fff;padding:0;cursor:pointer;text-align:left;overflow:hidden;position:relative;display:flex;flex-direction:column;font:inherit}
.pk:hover{border-color:var(--blue)}
.pk.on{border-color:var(--navy);box-shadow:0 0 0 3px var(--box-line)}
.pk.on::after{content:"✓";position:absolute;top:6px;right:6px;background:var(--navy);color:#fff;border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700}
.pkimg{height:96px;background:var(--box);display:flex;align-items:center;justify-content:center;font-size:44px;line-height:1}
.pkimg img{width:100%;height:100%;object-fit:cover}
.pkn{padding:6px 8px 0;font-size:12.5px;font-weight:600;color:var(--navy);line-height:1.25}
.pkm{padding:2px 8px 8px;font-size:11px;color:var(--muted)}
.cth{width:28px;height:28px;border-radius:5px;background:var(--box);display:inline-flex;align-items:center;justify-content:center;font-size:16px;line-height:1;overflow:hidden;flex:none}
.cth img{width:100%;height:100%;object-fit:cover}
.urow{display:grid;grid-template-columns:minmax(0,1fr) 170px 170px 110px 64px;gap:10px;align-items:center;padding:7px 12px;border-bottom:1px solid var(--line2)}
.urow:last-child{border-bottom:0}
.urow{background-image:linear-gradient(var(--line2),var(--line2)),linear-gradient(var(--line2),var(--line2)),linear-gradient(var(--line2),var(--line2)),linear-gradient(var(--line2),var(--line2));background-repeat:no-repeat;background-size:1px 100%;background-position:right 81px top,right 201px top,right 381px top,right 561px top}
.urow.uhd{background-color:#FAFBFC;font-size:11.5px;font-weight:700;padding:6px 12px;color:var(--muted)}
.urow .h-have{text-align:right;color:var(--blue)}.urow .h-need{color:var(--warn)}
.urow .uh{display:flex;justify-content:flex-end}
.urow .c-need,.urow .c-buy{text-align:right}
.urow .uc{text-align:center}
.urow.tobuy{background-color:#FFFBF0}
@media (min-width:761px){
  .urow .c-need{display:flex;justify-content:flex-end;align-items:center;gap:10px;white-space:nowrap}
  .urow .keep{display:inline-flex;align-items:center;gap:4px;margin-top:0}
}
.nm2{min-width:0;display:block}.nm2 .n{display:block}.nm2 .f{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm2 .dsh{color:#8A93A0}
.okmark{color:var(--ok);font-weight:700}
.urow .ml{display:none}
.keep{display:block;font-size:11px;color:var(--muted);font-family:"Noto Sans",sans-serif;margin-top:2px}
.keep .par{width:44px;border:1px solid var(--line);border-radius:4px;padding:1px 4px;font-size:11.5px;text-align:right}
.urow.uhd .c-need,.urow.uhd .c-buy{font-family:inherit;font-size:11.5px}
.hint{font-size:12px;color:var(--muted);margin:-4px 0 10px}
.c-have{font-size:12.5px;text-align:right;font-family:"IBM Plex Mono",monospace;color:var(--muted)}
.rcard .n{font-weight:700;color:var(--navy)}
.rcard .m{font-size:12px;color:var(--muted)}
/* modal */
.ov{position:fixed;inset:0;background:rgba(20,28,40,.45);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:50}
.ov.on{display:flex}
.modal{background:#fff;border-radius:8px;max-width:760px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.modal .mh{background:var(--navy);color:#fff;padding:10px 16px;border-radius:8px 8px 0 0;display:flex;justify-content:space-between;align-items:center;font-weight:700}
.modal .mh button{background:none;border:0;color:#fff;font-size:20px;cursor:pointer;line-height:1}
.modal .mb{padding:16px}
.modal .mf{padding:10px 16px;border-top:1px solid var(--line2);display:flex;justify-content:space-between;gap:8px}
.subh{border-left:4px solid var(--navy);padding-left:8px;font-weight:700;color:var(--navy);margin:14px 0 8px}
table.t{border-collapse:collapse;width:100%}
table.t th,table.t td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
table.t th{background:var(--box);color:var(--navy)}
table.t td.q{font-family:"IBM Plex Mono",monospace;white-space:nowrap}
ol.steps{margin:0;padding-left:22px} ol.steps li{margin-bottom:6px}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:4px}

}

<body>
<div id="gate" class="gate" style="display:none"></div>
<div class="wrap" id="app" style="display:none">
  <div class="verline">Weekly Meal Plan&nbsp;|&nbsp;<b>v2.05</b>&nbsp;|&nbsp;Updated 2026-11-22</div>
  <header class="top">
    <div>
      <div class="kicker">Home kitchen · Meal plan, shopping &amp; recipes</div>
      <h1>Weekly Meal Plan</h1>
      <div class="sub" id="subRange">&nbsp;</div>
    </div>
    <div class="owner-area" id="ownerArea"></div>
  </header>

  <div class="toolbar">
    <div class="tabs">
      <button class="tab" data-tab="plan">Meal Plan</button>
      <button class="tab" data-tab="shopping">Stock &amp; Shopping</button>
      <button class="tab" data-tab="recipes">Recipes</button>
    </div>
    <div class="weeknav" id="weekNav">
      <button class="btn sm" id="prevW" aria-label="Previous week">‹</button>
      <span class="range" id="rangeLbl"></span>
      <button class="btn sm" id="nextW" aria-label="Next week">›</button>
      <button class="btn sm" id="thisW">Today</button>
      <button class="btn sm" id="printBtn">Print</button>
    </div>
  </div>

  <main id="main"><div class="loading">Loading…</div></main>

  <footer><span>Weekly Meal Plan · data saved online (Firebase)</span><span id="syncInfo"></span></footer>
</div>

<div class="ov" id="ov"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="itemPhotoInput" accept="image/*" style="display:none">

<script>
/* Firebase web config (public values; paste from Firebase console → Project settings → Your apps) */
const FB_CONFIG = {apiKey:"AIzaSyBTinGFHHGxdjNcm9wY6DWuAktFbp5OMrU", authDomain:"meal-plan-e954d.firebaseapp.com", projectId:"meal-plan-e954d", storageBucket:"meal-plan-e954d.firebasestorage.app", messagingSenderId:"593740460337", appId:"1:593740460337:web:afc4b1e5767ccc76324010"};
const EMU = /^(localhost|127\.0\.0\.1)$/.test(location.hostname) && /[?&]emu=1/.test(location.search); // local test only
const CONFIGURED = EMU || !!FB_CONFIG.apiKey;
let auth=null, fs=null;
if(CONFIGURED){
  firebase.initializeApp(EMU?{apiKey:"demo-key",authDomain:"localhost",projectId:"demo-mealplan",appId:"demo"}:FB_CONFIG);
  auth=firebase.auth(); fs=firebase.firestore();
  if(EMU){ auth.useEmulator("http://127.0.0.1:9099",{disableWarnings:true}); fs.useEmulator("127.0.0.1",8080); }
  else fs.enablePersistence({synchronizeTabs:true}).catch(()=>{});
}
const C = n => fs.collection(n);
const nowIso = () => new Date().toISOString();
const docs = snap => snap.docs.map(d=>({...d.data(),id:d.id}));
const kid = k => encodeURIComponent(k); // Firestore doc id from an item key
async function tryDo(fn){ try{ await fn(); return null; }catch(e){ console.error(e); return e; } }
function eMsg(e){ const c=e&&e.code||""; return c==="permission-denied"?"No permission (are you signed in as a member?)":c==="unavailable"?"Offline — check the internet":(e&&e.message)||String(e); }

const SLOTS = [["breakfast","Breakfast"],["lunch","Lunch"],["dinner","Dinner"],["snack","Snack"]];
const CATS = ["Breakfast","Main","Soup & Stew","Side","Rice & Noodles","Snack","Other"];
const SHOP_CATS = ["Vegetables","Fruits","Meat & Eggs","Dairy & Bakery","Grains","Korean Pantry","Others"];
const DAYS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

const S = {
  tab: "plan", week: mondayOf(new Date()), recipes: [], rmap: {}, entries: [], note: null,
  checks: {}, extras: [], inv: {}, rows: {}, buyRows: {}, allEntries: [], shopFilter: "all", palCat: "All", drag: null, pick: null, sSearch: "", session: null, isAdmin: false, hasAdmin: true,
  rCat: "All", rSearch: "", loadedAt: null, err: null
};

/* ---------- helpers ---------- */
function esc(s){return String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function pad(n){return String(n).padStart(2,"0");}
function ymd(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function parseYmd(s){const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d);}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x;}
function mondayOf(d){/* week starts on Sunday */const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());return addDays(x,-x.getDay());}
function fmtShort(d){return d.getDate()+" "+MON[d.getMonth()];}
function weekDays(){return [...Array(7)].map((_,i)=>addDays(S.week,i));}
function rangeText(){const e=addDays(S.week,6),s=S.week;return (s.getMonth()===e.getMonth()?s.getDate():fmtShort(s))+" – "+fmtShort(e)+" "+e.getFullYear();}
function fmtQty(n){if(n===null||n===undefined||n==="")return "";const v=Math.round(Number(n)*100)/100;const fr={0.25:"¼",0.5:"½",0.75:"¾"};const w=Math.floor(v),f=Math.round((v-w)*100)/100;if(fr[f])return (w?w:"")+fr[f];return String(v);}
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("on");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("on"),2600);}
function totalMin(r){return (r.prep_min||0)+(r.cook_min||0);}
function safeImg(u){return /^https:\/\/[^"'<>\s]+$/.test(u||"")||/^fs:[A-Za-z0-9_-]+$/.test(u||"")?u:"";}
/* photos live in Firestore (collection "photos", one compressed JPEG data URL per doc); fields hold "fs:<docId>" */
const BLANK="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==";
const PH={}, PHP={};
const okData = d => /^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(d||"");
function blobToDataUrl(b){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=()=>rej(new Error("Cannot read image"));r.readAsDataURL(b);});}
async function savePhoto(file,max){
  let m=max,q=0.8,d="";
  for(let i=0;i<5;i++){ d=await blobToDataUrl(await shrinkImage(file,m,q)); if(d.length<600000) break; m=Math.round(m*0.8); q=Math.max(0.6,q-0.05); }
  if(d.length>=900000) throw new Error("Photo too large");
  const ref=await C("photos").add({data:d,created_at:nowIso()}); PH[ref.id]=d; return "fs:"+ref.id;
}
function dropPhoto(u){ if(/^fs:/.test(u||"")) C("photos").doc(u.slice(3)).delete().catch(()=>{}); }
function loadPhoto(id){
  if(PHP[id]) return PHP[id];
  return PHP[id]=(async()=>{const r=C("photos").doc(id);let s=null;try{s=await r.get({source:"cache"});}catch(_){}if(!s||!s.exists)s=await r.get();
    const d=s.exists?s.data().data:"";PH[id]=d;return d;})().catch(()=>{delete PHP[id];return "";});
}
function imgSrc(u){ // src attribute for an https URL or an "fs:" photo
  if(/^fs:/.test(u||"")){const id=u.slice(3);return okData(PH[id])?`src="${PH[id]}"`:`src="${BLANK}" data-ph="${esc(id)}"`;}
  return `src="${esc(u)}"`;
}
function hydratePhotos(){document.querySelectorAll("img[data-ph]").forEach(im=>{const id=im.dataset.ph;im.removeAttribute("data-ph");loadPhoto(id).then(d=>{if(okData(d))im.src=d;});});}
new MutationObserver(()=>{if(!hydratePhotos._q){hydratePhotos._q=1;queueMicrotask(()=>{hydratePhotos._q=0;hydratePhotos();});}}).observe(document.body,{childList:true,subtree:true});
async function shrinkImage(file,max=1280,quality=0.82){
  let src,w,h;
  try{src=await createImageBitmap(file);w=src.width;h=src.height;}
  catch(_){src=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error("Cannot read image"));i.src=URL.createObjectURL(file);});w=src.naturalWidth;h=src.naturalHeight;}
  const k=Math.min(1,max/Math.max(w,h)),c=document.createElement("canvas");c.width=Math.round(w*k);c.height=Math.round(h*k);
  c.getContext("2d").drawImage(src,0,0,c.width,c.height);
  return await new Promise((res,rej)=>c.toBlob(b=>b?res(b):rej(new Error("Image conversion failed")),"image/jpeg",quality));
}

/* ---------- data ---------- */
async function loadRecipes(){
  const s=await C("recipes").get();
  const data=docs(s).sort((a,b)=>String(a.name).localeCompare(String(b.name)));
  S.recipes=data; S.rmap=Object.fromEntries(data.map(r=>[r.id,r]));
}
async function loadWeek(){
  const ws=ymd(S.week), we=ymd(addDays(S.week,6)), back=ymd(addDays(new Date(),-120)), from=ws<back?ws:back;
  const [e,n,c,x,iv]=await Promise.all([
    C("entries").where("meal_date",">=",from).where("meal_date","<=",we).get(),
    C("weekNotes").doc(ws).get(),
    C("shopChecks").where("week_start","==",ws).get(),
    C("shopExtras").where("week_start","==",ws).get(),
    C("inventory").get()
  ]);
  const byTime=(a,b)=>String(a.created_at||"").localeCompare(String(b.created_at||""));
  const ent=docs(e).sort((a,b)=>(a.sort||0)-(b.sort||0)||byTime(a,b));
  S.inv=Object.fromEntries(docs(iv).map(v=>[v.item_key,v]));
  S.allEntries=ent; S.entries=ent.filter(v=>v.meal_date>=ws&&v.meal_date<=we); S.note=n.exists?n.data():null; S.extras=docs(x).sort(byTime);
  S.checks=Object.fromEntries(docs(c).map(k=>[k.item_key,k.checked]));
  S.loadedAt=new Date();
}
async function loadAll(){
  try{ S.err=null; await Promise.all([loadRecipes(),loadWeek()]); }
  catch(err){ console.error(err); S.err=eMsg(err); }
  render();
}
async function refreshWeek(){ try{ S.err=null; await loadWeek(); }catch(err){ S.err=eMsg(err);} render(); }

/* ---------- auth ---------- */
async function refreshAuth(){
  const u=auth.currentUser;
  S.user=u; S.session=u?{user:{email:u.email}}:null;
  S.isAdmin=false; S.isOwner=false; S.role=u?"none":"viewer";
  if(u){
    try{
      const ref=C("config").doc("owner"); let o=await ref.get();
      if(!o.exists&&u.emailVerified){
        try{ await ref.set({uid:u.uid,email:u.email||"",claimed_at:nowIso()}); toast("You are now the owner of this meal plan."); }catch(e){ console.error(e); }
        o=await ref.get();
      }
      S.hasAdmin=o.exists;
      if(o.exists&&o.data().uid===u.uid) S.role="owner";
      else if(u.emailVerified&&u.email){ const ed=await C("editors").doc(u.email.toLowerCase()).get(); if(ed.exists) S.role="editor"; }
    }catch(e){ console.error(e); S.authErr=eMsg(e); }
    S.isAdmin=S.role==="owner"||S.role==="editor"; S.isOwner=S.role==="owner";
  }
  renderOwner();
}
function renderOwner(){
  const el=document.getElementById("ownerArea");
  if(!S.session){ el.innerHTML=""; return; }
  el.innerHTML=(S.isOwner?'<span class="tag ok">Owner · edit mode</span> <button class="btn sm" id="teamBtn">People</button>':
    S.isAdmin?'<span class="tag ok">Editor · edit mode</span>':'<span class="tag bad">No access</span>')+
    ' <button class="btn sm" id="signOut">Sign out</button>';
  const tb=document.getElementById("teamBtn"); if(tb) tb.onclick=openTeam;
  document.getElementById("signOut").onclick=()=>auth.signOut();
}

async function openTeam(){
  let data;
  try{ data=docs(await C("editors").get()).sort((a,b)=>String(a.added_at||"").localeCompare(String(b.added_at||""))); }
  catch(e){ return toast(eMsg(e)); }
  const rows=data.map(e=>`<tr><td>${esc(e.label||"")}</td><td>${esc(e.email)}</td><td style="text-align:right"><button class="btn sm danger" data-rm="${esc(e.email)}">Remove</button></td></tr>`).join("")||'<tr><td colspan="3" style="color:var(--muted)">No one added yet.</td></tr>';
  openModal("People who can edit",`
    <div class="form">
      <p style="margin:0 0 10px;color:var(--muted)">People added here can edit meals and recipes (same as you). They sign in with <b>Continue with Google</b> using this email, or create an account with this email and confirm it.</p>
      <table class="tbl" style="width:100%;margin-bottom:12px"><thead><tr><th>Name</th><th>Email</th><th></th></tr></thead><tbody>${rows}</tbody></table>
      <label>Name</label><input id="tmLabel" placeholder="e.g. Maid">
      <label>Email</label><input id="tmEmail" type="email" placeholder="name@example.com">
      <div style="margin-top:10px;text-align:right"><button class="btn primary" id="tmAdd">Add person</button></div>
      <div class="subh">YouTube video search</div>
      <p style="margin:0 0 6px;color:var(--muted);font-size:12.5px">${S.ytKey?"A YouTube key is saved — “Find video” in recipes shows videos to pick.":"No key yet — “Find video” opens YouTube in a new tab instead."}</p>
      <div class="ytrow"><input id="tmYt" type="password" autocomplete="off" placeholder="YouTube Data API key"><button class="btn sm" id="tmYtSave">Save key</button>${S.ytKey?'<button class="btn sm danger" id="tmYtDel">Remove</button>':""}</div>
    </div>`,"");
  const saveKey=async k=>{ const e=await tryDo(()=>C("config").doc("settings").set({ytKey:k,updated_at:nowIso()})); if(e) return toast(eMsg(e)); S.ytKey=k; toast(k?"Key saved":"Key removed"); openTeam(); };
  document.getElementById("tmYtSave").onclick=()=>{ const k=document.getElementById("tmYt").value.trim(); if(!/^[A-Za-z0-9_-]{30,60}$/.test(k)) return toast("That does not look like an API key"); saveKey(k); };
  const yd=document.getElementById("tmYtDel"); if(yd) yd.onclick=()=>saveKey("");
  document.getElementById("tmAdd").onclick=async()=>{
    const email=document.getElementById("tmEmail").value.trim().toLowerCase(), label=document.getElementById("tmLabel").value.trim();
    if(!/^[^\s/]+@[^\s/]+\.[^\s/]+$/.test(email)) return toast("Enter a valid email");
    const err=await tryDo(()=>C("editors").doc(email).set({email,label:label||null,added_at:nowIso()}));
    if(err) return toast(eMsg(err)); toast("Added"); openTeam();
  };
  document.querySelectorAll("[data-rm]").forEach(b=>b.onclick=async()=>{
    const err=await tryDo(()=>C("editors").doc(b.dataset.rm).delete());
    if(err) return toast(eMsg(err)); toast("Removed"); openTeam();
  });
}

/* ---------- modal ---------- */
function openModal(title,body,foot,wide){
  document.getElementById("modal").className="modal"+(wide?" wide":"");
  document.getElementById("modal").innerHTML=`<div class="mh"><span>${esc(title)}</span><button onclick="closeModal()" aria-label="Close">×</button></div><div class="mb">${body}</div>${foot?`<div class="mf">${foot}</div>`:""}`;
  document.getElementById("ov").classList.add("on");
}
function closeModal(){document.getElementById("ov").classList.remove("on");}
document.getElementById("ov").addEventListener("mousedown",e=>{if(e.target.id==="ov")closeModal();});
document.addEventListener("keydown",e=>{if(e.key==="Escape"){closeModal();if(S.pick){S.pick=null;render();}}});

/* ---------- render ---------- */
function wkc(d){const w=d.getDay();return w===0?"sun":w===6?"sat":"";}
function render(){
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.tab===S.tab));
  document.getElementById("rangeLbl").textContent=rangeText();
  document.getElementById("subRange").textContent="Week of "+rangeText();

const STATUS=[["ok","Enough"],["low","Low"],["out","Out"]];
function invKey(item,unit,staple){const i=String(item||"").trim().toLowerCase();return staple?"s|"+i:i+"|"+String(unit||"").trim().toLowerCase();}
function rnd(n){return Math.round(n*100)/100;}
function useMap(from,to){ // ingredient amounts used by planned meals with from <= date <= to (ymd)
  const m={};
  for(const e of S.allEntries){
    if(e.meal_date<from||e.meal_date>to) continue;
    const r=e.recipe_id&&S.rmap[e.recipe_id]; if(!r) continue;
    const f=e.servings?e.servings/r.servings:1;
    for(const ing of (r.ingredients||[])){ if(!ing.item||ing.staple) continue;
      const q=parseFloat(ing.qty); if(isNaN(q)) continue;
      const k=invKey(ing.item,String(ing.unit||"").trim(),false); m[k]=(m[k]||0)+q*f; }
  }
  return m;
}
function usedBetween(key,fromExcl,toExcl){ // meals strictly after fromExcl and strictly before toExcl
  let t=0;
  for(const e of S.allEntries){
    if(e.meal_date<=fromExcl||e.meal_date>=toExcl) continue;
    const r=e.recipe_id&&S.rmap[e.recipe_id]; if(!r) continue;
    const f=e.servings?e.servings/r.servings:1;
    for(const ing of (r.ingredients||[])){ if(!ing.item||ing.staple) continue;
      if(invKey(ing.item,String(ing.unit||"").trim(),false)!==key) continue;
      const q=parseFloat(ing.qty); if(!isNaN(q)) t+=q*f; }
  }
  return t;
}
function attachInv(a){
  const v=S.inv[a.key];
  a.raw=v&&v.qty!=null?Number(v.qty):null; a.status=v?v.status:null; a.counted=v?(v.counted_at||v.updated_at):null;
  if(a.raw!=null&&!a.staple){a.used=rnd(usedBetween(a.key,ymd(new Date(a.counted)),ymd(new Date())));a.stock=rnd(Math.max(0,a.raw-a.used));}
  else {a.used=0;a.stock=a.raw;}
  return a;
}
const COUNT_UNITS=new Set(["pcs","pc","piece","pieces","bunch","bunches","stalk","stalks","leaves","leaf","slices","slice","strips","strip","bowl","bottle","pack","packet","can","clove","cloves","head","heads"]);
function buildNeeds(){
  const agg={}, today=ymd(new Date()), ws=ymd(S.week), needFrom=ws>today?ws:today;
  for(const e of S.entries){
    if(e.meal_date<needFrom) continue; // meals already eaten are taken out of stock automatically
    const r=e.recipe_id&&S.rmap[e.recipe_id]; if(!r) continue;
    const f=e.servings?e.servings/r.servings:1;
    for(const ing of (r.ingredients||[])){
      if(!ing.item) continue;
      const staple=!!ing.staple, unit=staple?"":String(ing.unit||"").trim(), key=invKey(ing.item,unit,staple);
      const a=agg[key]||(agg[key]={key,item:ing.item.trim(),unit,cat:SHOP_CATS.includes(ing.cat)?ing.cat:"Others",staple,need:0,num:false,dishes:new Set()});
      const q=parseFloat(ing.qty); if(!isNaN(q)){a.need+=q*f;a.num=true;}
      a.dishes.add(r.name.replace(/\s*\(.*\)$/,""));
    }
  }
  const before=ws>today?useMap(today,ymd(addDays(S.week,-1))):{}; // meals between today and the start of a future week
  return Object.values(agg).map(a=>{attachInv(a);
    a.have=a.stock==null?null:rnd(Math.max(0,a.stock-(before[a.key]||0)));
    if(a.staple) a.buy=(a.status==="low"||a.status==="out");
    else if(a.num){a.buyQty=rnd(Math.max(0,a.need-(a.have||0)));if(a.buyQty>0&&COUNT_UNITS.has(String(a.unit).toLowerCase()))a.buyQty=Math.ceil(a.buyQty-1e-9);a.buy=a.buyQty>0;}
    else a.buy=!(a.have>0);
    return a;});
}

function openItemEdit(key){
  const a=S.rows[key]; if(!a) return; const cur=S.inv[key]||{}; const uses=recipeUses(key);
  openModal("Edit item",`<div class="form">
    ${uses.length?`<p style="margin:0 0 10px;color:var(--muted);font-size:13px">Used in: ${esc(uses.join(", "))}. Changes to name, unit or category are also saved in these recipes.</p>`:""}
    <label>Name</label><input id="ieN" value="${esc(a.item)}">
    ${a.staple?"":`<label>Unit</label><input id="ieU" value="${esc(a.unit||"")}">`}
    <label>Category</label><select id="ieC">${SHOP_CATS.map(c=>`<option ${c===a.cat?"selected":""}>${c}</option>`).join("")}</select>
    ${a.staple?"":`<label>Keep at least (optional)</label><input id="ieP" type="number" min="0" step="any" inputmode="decimal" value="${cur.par??""}">`}
  </div>`,`<span>${uses.length?"":'<button class="btn danger" id="ieDel">Delete item</button>'}</span><button class="btn primary" id="ieSave">Save</button>`);
  const del=document.getElementById("ieDel");
  if(del) del.onclick=async()=>{
    if(del.dataset.sure!=="1"){del.dataset.sure="1";del.textContent="Tap again to delete";return;}
    const error=await tryDo(()=>C("inventory").doc(kid(key)).delete()); if(error) return toast(eMsg(error));
    dropPhoto(cur.photo_url); delete S.inv[key]; closeModal(); toast(a.item+" deleted"); render();
  };
  document.getElementById("ieSave").onclick=async()=>{
    const pEl=document.getElementById("ieP"), pr=pEl?pEl.value.trim():""; const par=pr===""?null:parseFloat(pr);
    if(par!==null&&(isNaN(par)||par<0)) return toast("Keep must be a number");
    const item=document.getElementById("ieN").value.trim(); if(!item) return toast("Name is empty");
    const unit=a.staple?"":document.getElementById("ieU").value.trim();
    const cat=document.getElementById("ieC").value, nk=invKey(item,unit,!!a.staple);
    if(nk!==key&&(S.inv[nk]||allStockItems().some(x=>x.key===nk))) return toast("An item with that name and unit already exists");
    const row={...cur,item_key:nk,item,unit:unit||null,category:cat,is_staple:!!a.staple,qty:cur.qty??null,status:cur.status??null,counted_at:cur.counted_at??nowIso(),par,updated_at:nowIso()};
    delete row.id;
    const recUpd=[];
    if(item!==a.item||unit!==(a.unit||"")||cat!==a.cat) for(const r of S.recipes){
      let hit=false;
      const ings=(r.ingredients||[]).map(g=>{ if(!g.item||invKey(g.item,g.staple?"":String(g.unit||"").trim(),!!g.staple)!==key) return g;
        hit=true; return {...g,item,cat,...(a.staple?{}:{unit})}; });
      if(hit) recUpd.push([r.id,ings]);
    }
    const error=await tryDo(()=>{const b=fs.batch();
      b.set(C("inventory").doc(kid(nk)),row);
      if(nk!==key) b.delete(C("inventory").doc(kid(key)));
      for(const [id,ings] of recUpd) b.update(C("recipes").doc(id),{ingredients:ings,updated_at:nowIso()});
      return b.commit();});
    if(error) return toast("Not saved: "+eMsg(error));
    if(nk!==key) delete S.inv[key]; S.inv[nk]=row;
    for(const [id,ings] of recUpd){ S.rmap[id].ingredients=ings; }
    closeModal(); toast(recUpd.length?`Saved (also in ${recUpd.length} recipe${recUpd.length>1?"s":""})`:"Saved"); render();
  };
}
function allStockItems(){
  const map={};
  for(const r of S.recipes) for(const ing of (r.ingredients||[])){
    if(!ing.item) continue;
    const staple=!!ing.staple, unit=staple?"":String(ing.unit||"").trim(), key=invKey(ing.item,unit,staple);
    if(!map[key]) map[key]={key,item:ing.item.trim(),unit,cat:SHOP_CATS.includes(ing.cat)?ing.cat:"Others",staple};
  }
  for(const k in S.inv) if(!map[k]){const v=S.inv[k];map[k]={key:k,item:v.item,unit:v.unit||"",cat:SHOP_CATS.includes(v.category)?v.category:"Others",staple:v.is_staple};}
  return Object.values(map).map(attachInv);
}
async function saveInv(a,patch,recount){
  const cur=S.inv[a.key]||{};
  const qty=("qty" in patch)?patch.qty:(cur.qty??null), status=("status" in patch)?patch.status:(cur.status??null);
  const now=nowIso(), row={item_key:a.key,item:a.item,unit:a.unit||null,category:a.cat,is_staple:!!a.staple,qty,status,updated_at:now,counted_at:(recount||!cur.counted_at)?now:cur.counted_at};
  const error=await tryDo(()=>C("inventory").doc(kid(a.key)).set(row,{merge:true}));
  if(error){toast("Not saved: "+eMsg(error));render();return false;}
  S.inv[a.key]={...cur,...row};
  render();return true;
}

/* Gemini (Firebase AI Logic, Gemini Developer API backend) — uses the public Firebase web config, no extra key */
const AI_MODELS=["gemini-3.5-flash","gemini-3.5-flash-lite"];
const RECIPE_SCHEMA={type:"OBJECT",properties:{
  name:{type:"STRING",description:"Dish name. Korean dishes: romanized Korean name, then the English name in parentheses, e.g. 'Japchae (Glass Noodle Stir-fry)'. Other dishes: plain English name."},
  category:{type:"STRING",enum:CATS},
  servings:{type:"INTEGER"},prep_min:{type:"INTEGER"},cook_min:{type:"INTEGER"},
  ingredients:{type:"ARRAY",items:{type:"OBJECT",properties:{
    item:{type:"STRING"},qty:{type:"NUMBER",nullable:true},unit:{type:"STRING"},cat:{type:"STRING",enum:SHOP_CATS},staple:{type:"BOOLEAN"}},
    required:["item","unit","cat","staple"]}},
  steps:{type:"ARRAY",items:{type:"STRING"}},
  notes:{type:"STRING"}},
  required:["name","category","servings","prep_min","cook_min","ingredients","steps"]};
async function geminiJSON(prompt,system){
  if(EMU&&window.__aiMock) return window.__aiMock(prompt);
  let last;
  for(const m of AI_MODELS){
    const res=await fetch(`https://firebasevertexai.googleapis.com/v1beta/projects/${FB_CONFIG.projectId}/models/${m}:generateContent`,{method:"POST",
      headers:{"Content-Type":"application/json","x-goog-api-key":FB_CONFIG.apiKey,"X-Firebase-Appid":FB_CONFIG.appId},
      body:JSON.stringify({systemInstruction:{parts:[{text:system}]},contents:[{role:"user",parts:[{text:prompt}]}],
        generationConfig:{responseMimeType:"application/json",responseSchema:RECIPE_SCHEMA,temperature:0.4}})});
    const j=await res.json().catch(()=>({}));
    if(res.ok){ const t=(j.candidates?.[0]?.content?.parts||[]).map(p=>p.text||"").join(""); return JSON.parse(t); }
    last=j.error||{message:"HTTP "+res.status};
    if(!(res.status===404||(res.status===400&&/model/i.test(last.message||"")))) break; // only try the next model if this one is unknown
  }
  const msg=last&&last.message||"Gemini error";
  throw new Error(/not been used|disabled|PERMISSION_DENIED/i.test(msg)?"Gemini is not turned on yet (owner: Firebase console → AI Logic → Get started).":msg);
}
function geminiSystem(){
  const known=[...new Set(allStockItems().map(a=>a.staple?a.item+" (pantry)":a.item+" ["+a.unit+"]"))].slice(0,200).join("; ");
  return `You write home-cooking recipes for a cook (a maid) in Pune, India, who reads simple English. The family is Korean.
Rules:
- Ingredients must be easy to buy in Pune (Indian markets, BigBasket, Korean/Asian stores). Suggest a local substitute in notes when needed.
- Use simple units: pcs, g, kg, ml, cup, tbsp, tsp, bunch, stalk, slices, leaves, clove, pinch.
- Mark sauces, oils, salt, sugar, spices and seasonings as staple=true (kept in the pantry). Fresh food is staple=false.
- If an ingredient already exists in this list, reuse EXACTLY the same name and unit: ${known||"(none yet)"}.
- Steps: short, clear sentences, one action each, include heat level and minutes. No numbering.
- notes: one short tip for the cook.`;
}
function aiToDraft(d){
  const cat=x=>SHOP_CATS.includes(x)?x:"Others";
  return {name:String(d.name||"").trim(),category:CATS.includes(d.category)?d.category:"Main",servings:Math.max(1,parseInt(d.servings)||2),
    prep_min:Number.isFinite(d.prep_min)?d.prep_min:"",cook_min:Number.isFinite(d.cook_min)?d.cook_min:"",
    ingredients:(d.ingredients||[]).filter(g=>g&&g.item).map(g=>({item:String(g.item).trim(),qty:(g.qty===null||g.qty===undefined)?"":g.qty,unit:String(g.unit||"").trim(),cat:cat(g.cat),...(g.staple?{staple:true}:{})})),
    steps:(d.steps||[]).map(x=>String(x).trim()).filter(Boolean),notes:String(d.notes||"").trim(),video_url:""};
}

    }
  };
  document.getElementById("gPw").onkeydown=e=>{if(e.key==="Enter")document.getElementById("gGo").click();};
  document.getElementById("gGo").onclick=async()=>{
    const [email,password]=val(); if(!email||!password) return msg('<span class="tag bad">Enter email and password</span>');
    msg("Signing in…");
    const e=await tryDo(()=>auth.signInWithEmailAndPassword(email,password));
    if(e) msg('<span class="tag bad">'+esc(authErr(e))+'</span>');
  };
  document.getElementById("gUp").onclick=async()=>{
    const [email,password]=val(); if(!email||password.length<8) return msg('<span class="tag bad">Email and a password of 8+ characters needed</span>');
    msg("Creating account…");
    try{ const c=await auth.createUserWithEmailAndPassword(email,password); await c.user.sendEmailVerification(); }
    catch(e){ msg('<span class="tag bad">'+esc(authErr(e))+'</span>'); }
  };
  document.getElementById("gForgot").onclick=async ev=>{
    ev.preventDefault(); const [email]=val(); if(!email) return msg('<span class="tag bad">Type your email first</span>');
    const e=await tryDo(()=>auth.sendPasswordResetEmail(email));
    msg(e?'<span class="tag bad">'+esc(authErr(e))+'</span>':'<span class="tag ok">Password reset email sent</span>');
  };
}

/* one-time import of the old (Supabase) data — owner only, shown while there are no recipes */
async function importData(file){
  let d; try{ d=JSON.parse(await file.text()); }catch(e){ return toast("Not a valid data file"); }
  const ops=[], strip=o=>{const x={...o};delete x.id;return x;};
  for(const r of d.recipes||[]) ops.push([C("recipes").doc(r.id),{...strip(r),photo_url:null}]);
  for(const e of d.entries||[]) ops.push([C("entries").doc(e.id),strip(e)]);
  for(const n of d.week_notes||[]) ops.push([C("weekNotes").doc(n.week_start),n]);
  for(const x of d.shopping_extras||[]) ops.push([C("shopExtras").doc(x.id),strip(x)]);
  for(const c of d.shopping_checks||[]) ops.push([C("shopChecks").doc(kid(c.week_start+"|"+c.item_key)),c]);
  for(const v of d.inventory||[]) ops.push([C("inventory").doc(kid(v.item_key)),{...v,photo_url:null}]);
  if(!ops.length) return toast("The file has no data");
  toast("Importing "+ops.length+" rows…");
  try{ for(let i=0;i<ops.length;i+=400){ const b=fs.batch(); ops.slice(i,i+400).forEach(([ref,val])=>b.set(ref,val)); await b.commit(); } }
  catch(e){ return toast("Import failed: "+eMsg(e)); }
  toast("Imported "+ops.length+" rows"); await loadAll();
}

if(CONFIGURED){
  auth.onAuthStateChanged(()=>boot());
  auth.getRedirectResult().catch(e=>{ if(e&&e.code&&e.code!=="auth/no-auth-event") toast(authErr(e)); });
} else renderGate();
