<!DOCTYPE html>
<html lang="en" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weekly Meal Plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --ink:#1E2430; --muted:#656B75; --navy:#1F3A5F; --blue:#2E5A8A;
  --box:#EAF1F8; --box-line:#C9D5E3; --line:#D0D7DE; --line2:#E3E6EB;
  --bg:#FFFFFF; --surface:#FFFFFF; --today:#FFF6E0; --today-line:#DBC490;
  --ok:#2E7D4F; --ok-bg:#DCEFE3; --warn:#9A6A00; --warn-bg:#FFE9C2; --bad:#B23B3B; --bad-bg:#F6D6D6;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans",system-ui,sans-serif;font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1320px;margin:0 auto;padding:14px 28px 48px}
.mono{font-family:"IBM Plex Mono",monospace}
.verline{display:flex;justify-content:flex-end;font-size:11.5px;color:var(--muted)}
.verline b{color:var(--ink)}
header.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;border-bottom:2px solid var(--navy);padding:6px 0 10px;margin-bottom:14px}
.kicker{font-size:12px;color:var(--muted)}
h1{margin:2px 0 2px;font-size:26px;color:var(--navy);font-weight:700;letter-spacing:-.2px}
.sub{color:var(--blue);font-weight:600}
.owner-area{display:flex;align-items:center;gap:8px}
.tag{display:inline-block;padding:2px 8px;border-radius:4px;font-size:12px;font-weight:600}
.tag.ok{background:var(--ok-bg);color:var(--ok)} .tag.warn{background:var(--warn-bg);color:var(--warn)} .tag.bad{background:var(--bad-bg);color:var(--bad)}
.btn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--blue);color:var(--blue)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.primary:hover{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.danger{color:var(--bad);border-color:#E7B7B7}
.btn.sm{padding:3px 9px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:default}
.toolbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.tabs{display:flex;gap:4px}
.tab{border:1px solid var(--line);background:#fff;padding:7px 16px;border-radius:6px;cursor:pointer;font-weight:600;color:var(--muted)}
.tab.on{background:var(--navy);border-color:var(--navy);color:#fff}
.weeknav{display:flex;align-items:center;gap:6px}
.weeknav .range{min-width:190px;text-align:center;font-weight:600;color:var(--navy)}
.secbar{background:var(--navy);color:#fff;font-weight:700;padding:7px 12px;border-radius:3px;margin:18px 0 10px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.secbar .r{font-weight:400;font-size:12.5px;opacity:.9}
.notebox{background:var(--box);border:1px solid var(--box-line);border-radius:4px;padding:10px 14px;margin-bottom:6px}
.notebox .h{font-weight:700;color:var(--navy);margin-bottom:2px}
.notebox textarea{width:100%;min-height:54px;border:1px solid var(--box-line);border-radius:4px;padding:6px 8px;background:#fff;resize:vertical}
.empty{color:var(--muted);font-style:italic}
/* plan grid */
.grid{display:grid;grid-template-columns:92px repeat(7,minmax(0,1fr));border:1px solid var(--line);border-radius:4px;overflow:hidden}
.grid > div{border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);padding:8px;min-height:44px}
.grid > div:nth-child(8n){border-right:0}
.gh{background:var(--box);font-weight:700;color:var(--navy);text-align:center;padding:8px 4px!important}
.gh .d{display:block;font-size:12px;color:var(--muted);font-weight:500}
.gh.today{background:var(--today);color:var(--warn)}
.gl{background:var(--box);font-weight:700;color:var(--navy);display:flex;align-items:center}
.cell.today{background:#FFFBF0}
.chip{display:flex;align-items:flex-start;gap:4px;border:1px solid var(--box-line);background:#fff;border-radius:5px;padding:4px 7px;margin-bottom:5px;font-size:13px;line-height:1.3}
.chip .nm{flex:1;cursor:pointer;color:var(--ink)}
.chip .nm.link:hover{color:var(--blue);text-decoration:underline}
.chip .nt{display:block;font-size:11.5px;color:var(--muted);font-style:italic}
.chip .x{border:0;background:none;color:var(--muted);cursor:pointer;padding:0 2px;font-size:14px;line-height:1}
.chip .x:hover{color:var(--bad)}
.addlink{border:1px dashed var(--box-line);background:none;color:var(--blue);border-radius:5px;width:100%;padding:3px;cursor:pointer;font-size:12.5px}
.daycards{display:none}
/* shopping */
.shopcols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}
.shopgrp{border:1px solid var(--line);border-radius:4px;overflow:hidden}
.shopgrp .gt{background:var(--box);border-bottom:1px solid var(--line);padding:7px 12px;font-weight:700;color:var(--navy);display:flex;justify-content:space-between}
.shopgrp .gt span{font-weight:500;color:var(--muted);font-size:12px}
.sitem{display:flex;gap:10px;align-items:flex-start;padding:7px 12px;border-bottom:1px solid var(--line2);cursor:pointer}
.sitem:last-child{border-bottom:0}
.sitem input{margin-top:3px;width:17px;height:17px;accent-color:var(--navy);cursor:pointer;flex:none}
.sitem .t{flex:1}
.sitem .q{font-family:"IBM Plex Mono",monospace;font-size:12.5px;color:var(--blue);white-space:nowrap}
.sitem .f{display:block;font-size:11.5px;color:var(--muted)}
.xdel{border:0;background:none;color:var(--muted);cursor:pointer;font-size:15px;padding:0 2px;line-height:1}.xdel:hover{color:var(--bad)}
.sitem.done .t .n,.sitem.done .q{text-decoration:line-through;color:var(--muted)}
.progress{height:8px;background:var(--line2);border-radius:4px;overflow:hidden;width:220px}
.progress > i{display:block;height:100%;background:var(--ok)}
.extraform{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.extraform input,.extraform select{border:1px solid var(--line);border-radius:5px;padding:5px 8px}
/* recipes */
.rfilter{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.rfilter input{border:1px solid var(--line);border-radius:6px;padding:6px 10px;width:240px}
.pill{border:1px solid var(--line);background:#fff;border-radius:14px;padding:4px 12px;cursor:pointer;font-size:12.5px}
.pill.on{background:var(--box);border-color:var(--box-line);color:var(--navy);font-weight:700}
.rgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.rcard{border:1px solid var(--line);border-left:4px solid var(--navy);border-radius:4px;padding:10px 12px;cursor:pointer;background:#fff;display:flex;flex-direction:column;gap:4px}
.rcard:hover{border-color:var(--blue);border-left-color:var(--blue)}
.rcard .n{font-weight:700;color:var(--navy)}
.rcard .m{font-size:12px;color:var(--muted)}
/* modal */
.ov{position:fixed;inset:0;background:rgba(20,28,40,.45);display:none;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:50}
.ov.on{display:flex}
.modal{background:#fff;border-radius:8px;max-width:760px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.modal .mh{background:var(--navy);color:#fff;padding:10px 16px;border-radius:8px 8px 0 0;display:flex;justify-content:space-between;align-items:center;font-weight:700}
.modal .mh button{background:none;border:0;color:#fff;font-size:20px;cursor:pointer;line-height:1}
.modal .mb{padding:16px}
.modal .mf{padding:10px 16px;border-top:1px solid var(--line2);display:flex;justify-content:space-between;gap:8px}
.subh{border-left:4px solid var(--navy);padding-left:8px;font-weight:700;color:var(--navy);margin:14px 0 8px}
table.t{border-collapse:collapse;width:100%}
table.t th,table.t td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
table.t th{background:var(--box);color:var(--navy)}
table.t td.q{font-family:"IBM Plex Mono",monospace;white-space:nowrap}
ol.steps{margin:0;padding-left:22px} ol.steps li{margin-bottom:6px}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:4px}
.form label{display:block;font-size:12px;color:var(--muted);margin:8px 0 3px}
.form input,.form select,.form textarea{width:100%;border:1px solid var(--line);border-radius:5px;padding:6px 8px;background:#fff}
.form textarea{min-height:110px;resize:vertical}
.row{display:grid;gap:8px}
.ingrow{display:grid;grid-template-columns:2.4fr .7fr .9fr 1.3fr 64px 28px;gap:5px;margin-bottom:5px;align-items:center}
.ingrow input,.ingrow select{padding:4px 6px;font-size:13px}
.ingrow .pc{font-size:11.5px;display:flex;gap:3px;align-items:center;color:var(--muted)}
.ingrow .pc input{width:auto}
.msg{font-size:13px;margin-top:8px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:6px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60}
.toast.on{opacity:1}
.loading{padding:30px;text-align:center;color:var(--muted)}
footer{margin-top:28px;border-top:1px solid var(--line2);padding-top:8px;font-size:11.5px;color:var(--muted);display:flex;justify-content:space-between}
@media (max-width:1100px){.rgrid{grid-template-columns:repeat(3,minmax(0,1fr))}.shopcols{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){
  .wrap{padding:10px 12px 40px}
  h1{font-size:21px}
  header.top{flex-wrap:wrap}
  .grid{display:none}
  .daycards{display:block}
  .dcard{border:1px solid var(--line);border-radius:4px;margin-bottom:10px;overflow:hidden}
  .dcard .dh{background:var(--box);padding:7px 12px;font-weight:700;color:var(--navy);display:flex;justify-content:space-between}
  .dcard.today .dh{background:var(--today);color:var(--warn)}
  .dcard .sl{display:grid;grid-template-columns:78px 1fr;border-top:1px solid var(--line2)}
  .dcard .sl > div{padding:7px 10px}
  .dcard .sl .lb{font-weight:600;color:var(--muted);font-size:12.5px}
  .shopcols{grid-template-columns:1fr}
  .rgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .weeknav .range{min-width:0}
  .toolbar{flex-direction:column;align-items:stretch}
  .ingrow{grid-template-columns:1fr 1fr 1fr;}
}
@media print{
  .noprint,.xdel,.toolbar,.owner-area,.addlink,.chip .x,.extraform{display:none!important}
  .wrap{padding:0;max-width:none}
  .grid{display:grid!important}.daycards{display:none!important}
  .secbar{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .gh,.gl,.shopgrp .gt{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="verline">Weekly Meal Plan&nbsp;|&nbsp;<b>v1.03</b>&nbsp;|&nbsp;Updated 2026-11-22</div>
  <header class="top">
    <div>
      <div class="kicker">Home kitchen · Meal plan, shopping &amp; recipes</div>
      <h1>Weekly Meal Plan</h1>
      <div class="sub" id="subRange">&nbsp;</div>
    </div>
    <div class="owner-area" id="ownerArea"></div>
  </header>

  <div class="toolbar">
    <div class="tabs">
      <button class="tab" data-tab="plan">Meal Plan</button>
      <button class="tab" data-tab="shopping">Shopping List</button>
      <button class="tab" data-tab="recipes">Recipes</button>
    </div>
    <div class="weeknav" id="weekNav">
      <button class="btn sm" id="prevW" aria-label="Previous week">‹ Prev</button>
      <span class="range" id="rangeLbl"></span>
      <button class="btn sm" id="nextW" aria-label="Next week">Next ›</button>
      <button class="btn sm" id="thisW">This week</button>
      <button class="btn sm" id="printBtn">Print</button>
    </div>
  </div>

  <main id="main"><div class="loading">Loading…</div></main>

  <footer><span>Weekly Meal Plan · data saved online</span><span id="syncInfo"></span></footer>
</div>

<div class="ov" id="ov"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
const SB_URL = "https://sqnuivviqajivhjtsaxn.supabase.co";
const SB_KEY = "sb_publishable_yLpUeDDRpo8wg2HRjzfJMw_9SOrRnq6";
const sb = window.supabase.createClient(SB_URL, SB_KEY);

const SLOTS = [["breakfast","Breakfast"],["lunch","Lunch"],["dinner","Dinner"],["snack","Snack"]];
const CATS = ["Breakfast","Main","Soup & Stew","Side","Rice & Noodles","Snack","Other"];
const SHOP_CATS = ["Vegetables","Meat & Eggs","Dairy & Bakery","Grains","Korean Pantry","Others"];
const DAYS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

const S = {
  tab: "plan", week: mondayOf(new Date()), recipes: [], rmap: {}, entries: [], note: null,
  checks: {}, extras: [], session: null, isAdmin: false, hasAdmin: true,
  rCat: "All", rSearch: "", loadedAt: null, err: null
};

/* ---------- helpers ---------- */
function esc(s){return String(s ?? "").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function pad(n){return String(n).padStart(2,"0");}
function ymd(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function parseYmd(s){const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d);}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x;}
function mondayOf(d){/* week starts on Sunday */const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());return addDays(x,-x.getDay());}
function fmtShort(d){return d.getDate()+" "+MON[d.getMonth()];}
function weekDays(){return [...Array(7)].map((_,i)=>addDays(S.week,i));}
function rangeText(){const e=addDays(S.week,6);return fmtShort(S.week)+" – "+fmtShort(e)+" "+e.getFullYear();}
function fmtQty(n){if(n===null||n===undefined||n==="")return "";const v=Math.round(Number(n)*100)/100;const fr={0.25:"¼",0.5:"½",0.75:"¾"};const w=Math.floor(v),f=Math.round((v-w)*100)/100;if(fr[f])return (w?w:"")+fr[f];return String(v);}
function toast(msg){const t=document.getElementById("toast");t.textContent=msg;t.classList.add("on");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("on"),2600);}
function totalMin(r){return (r.prep_min||0)+(r.cook_min||0);}

/* ---------- data ---------- */
async function loadRecipes(){
  const {data,error}=await sb.from("meal_recipes").select("*").order("name");
  if(error) throw error;
  S.recipes=data; S.rmap=Object.fromEntries(data.map(r=>[r.id,r]));
}
async function loadWeek(){
  const ws=ymd(S.week), we=ymd(addDays(S.week,6));
  const [e,n,c,x]=await Promise.all([
    sb.from("meal_entries").select("*").gte("meal_date",ws).lte("meal_date",we).order("sort").order("created_at"),
    sb.from("meal_week_notes").select("*").eq("week_start",ws).maybeSingle(),
    sb.from("meal_shopping_checks").select("item_key,checked").eq("week_start",ws),
    sb.from("meal_shopping_extras").select("*").eq("week_start",ws).order("created_at")
  ]);
  for(const r of [e,n,c,x]) if(r.error) throw r.error;
  S.entries=e.data; S.note=n.data; S.extras=x.data;
  S.checks=Object.fromEntries(c.data.map(k=>[k.item_key,k.checked]));
  S.loadedAt=new Date();
}
async function loadAll(){
  try{ S.err=null; await Promise.all([loadRecipes(),loadWeek()]); }
  catch(err){ console.error(err); S.err=err.message||String(err); }
  render();
}
async function refreshWeek(){ try{ S.err=null; await loadWeek(); }catch(err){ S.err=err.message||String(err);} render(); }

/* ---------- auth ---------- */
async function refreshAuth(){
  const {data:{session}}=await sb.auth.getSession();
  S.session=session;
  try{ const {data}=await sb.rpc("meal_has_admin"); S.hasAdmin=!!data; }catch(e){}
  if(session){
    if(!S.hasAdmin){ const {data}=await sb.rpc("claim_meal_admin"); if(data){S.hasAdmin=true; toast("You are now the owner of this meal plan.");} }
    const {data}=await sb.rpc("is_meal_admin"); S.isAdmin=!!data;
  } else S.isAdmin=false;
  renderOwner();
}
function renderOwner(){
  const el=document.getElementById("ownerArea");
  if(S.session){
    el.innerHTML=(S.isAdmin?'<span class="tag ok">Edit mode</span>':'<span class="tag bad">View only (not owner)</span>')+
      ' <button class="btn sm" id="signOut">Sign out</button>';
    document.getElementById("signOut").onclick=async()=>{await sb.auth.signOut();await refreshAuth();render();};
  } else {
    el.innerHTML='<button class="btn sm" id="ownerBtn">Owner sign in</button>';
    document.getElementById("ownerBtn").onclick=openSignIn;
  }
}
function openSignIn(){
  openModal("Owner sign in",`
    <div class="form">
      <p style="margin:0 0 6px;color:var(--muted)">Only the owner can change meals and recipes. Everyone with the link can view and tick the shopping list.</p>
      <label>Email</label><input id="siEmail" type="email" autocomplete="username">
      <label>Password</label><input id="siPw" type="password" autocomplete="current-password">
      <div class="msg" id="siMsg"></div>
    </div>`,
    `<span>${S.hasAdmin?"":'<button class="btn" id="siUp">Create owner account</button>'}</span><button class="btn primary" id="siGo">Sign in</button>`);
  const msg=t=>document.getElementById("siMsg").innerHTML=t;
  document.getElementById("siGo").onclick=async()=>{
    const email=document.getElementById("siEmail").value.trim(), password=document.getElementById("siPw").value;
    if(!email||!password) return msg('<span class="tag bad">Enter email and password</span>');
    const {error}=await sb.auth.signInWithPassword({email,password});
    if(error) return msg('<span class="tag bad">'+esc(error.message)+'</span>');
    closeModal(); await refreshAuth(); render();
  };
  const up=document.getElementById("siUp");
  if(up) up.onclick=async()=>{
    const email=document.getElementById("siEmail").value.trim(), password=document.getElementById("siPw").value;
    if(!email||password.length<8) return msg('<span class="tag bad">Email and a password of 8+ characters needed</span>');
    const {data,error}=await sb.auth.signUp({email,password});
    if(error) return msg('<span class="tag bad">'+esc(error.message)+'</span>');
    if(data.session){ closeModal(); await refreshAuth(); render(); }
    else msg('<span class="tag warn">Check your email and click the confirm link</span> The page it opens may show an error — that is fine. Then come back and press <b>Sign in</b>.');
  };
}

/* ---------- modal ---------- */
function openModal(title,body,foot){
  document.getElementById("modal").innerHTML=`<div class="mh"><span>${esc(title)}</span><button onclick="closeModal()" aria-label="Close">×</button></div><div class="mb">${body}</div>${foot?`<div class="mf">${foot}</div>`:""}`;
  document.getElementById("ov").classList.add("on");
}
function closeModal(){document.getElementById("ov").classList.remove("on");}
document.getElementById("ov").addEventListener("mousedown",e=>{if(e.target.id==="ov")closeModal();});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeModal();});

/* ---------- render ---------- */
function render(){
  document.querySelectorAll(".tab").forEach(b=>b.classList.toggle("on",b.dataset.tab===S.tab));
  document.getElementById("rangeLbl").textContent=rangeText();
  document.getElementById("subRange").textContent="Week of "+rangeText();
  document.getElementById("weekNav").style.visibility=S.tab==="recipes"?"hidden":"visible";
  document.getElementById("syncInfo").textContent=S.loadedAt?("Loaded "+pad(S.loadedAt.getHours())+":"+pad(S.loadedAt.getMinutes())):"";
  const m=document.getElementById("main");
  if(S.err){ m.innerHTML=`<div class="notebox" style="background:#FDEEEE;border-color:#E7B7B7"><div class="h" style="color:var(--bad)">Could not load data</div>${esc(S.err)}<div style="margin-top:8px"><button class="btn sm" onclick="loadAll()">Try again</button></div></div>`; return; }
  if(S.tab==="plan") renderPlan(m); else if(S.tab==="shopping") renderShop(m); else renderRecipes(m);
}

function entryName(e){const r=e.recipe_id&&S.rmap[e.recipe_id];return r?r.name:(e.title||"(untitled)");}
function chipHtml(e){
  const r=e.recipe_id&&S.rmap[e.recipe_id];
  const sv=e.servings&&r&&e.servings!==r.servings?` <span class="nt" style="display:inline">×${e.servings}</span>`:"";
  return `<div class="chip"><span class="nm ${r?"link":""}" ${r?`onclick="openRecipe('${r.id}')"`:""}>${esc(entryName(e))}${sv}${e.note?`<span class="nt">${esc(e.note)}</span>`:""}</span>${S.isAdmin?`<button class="x" title="Remove" onclick="delEntry('${e.id}')">×</button>`:""}</div>`;
}
function cellHtml(d,slot){
  const list=S.entries.filter(e=>e.meal_date===ymd(d)&&e.slot===slot);
  let h=list.map(chipHtml).join("");
  if(S.isAdmin) h+=`<button class="addlink" onclick="openAddEntry('${ymd(d)}','${slot}')">+ Add</button>`;
  else if(!list.length) h+='<span class="empty">—</span>';
  return h;
}
function renderPlan(m){
  const days=weekDays(), today=ymd(new Date());
  const slots=SLOTS.filter(([k])=>k!=="snack"||S.isAdmin||S.entries.some(e=>e.slot==="snack"));
  const ws=ymd(S.week);
  let noteHtml;
  if(S.isAdmin) noteHtml=`<div class="notebox"><div class="h">Notes for this week</div><textarea id="wkNote" placeholder="Instructions for this week (e.g. guests on Saturday, no lunch on Friday)">${esc(S.note?.note||"")}</textarea><div style="margin-top:6px;display:flex;gap:6px;justify-content:flex-end"><button class="btn sm" onclick="copyPrevWeek()">Copy previous week's plan</button><button class="btn sm primary" onclick="saveNote()">Save note</button></div></div>`;
  else noteHtml=S.note?.note?`<div class="notebox"><div class="h">Notes for this week</div>${esc(S.note.note).replace(/\n/g,"<br>")}</div>`:"";
  let g=`<div class="gh">&nbsp;</div>`+days.map((d,i)=>`<div class="gh ${ymd(d)===today?"today":""}">${DAYS[i]}<span class="d">${fmtShort(d)}</span></div>`).join("");
  for(const [k,lbl] of slots){
    g+=`<div class="gl">${lbl}</div>`+days.map(d=>`<div class="cell ${ymd(d)===today?"today":""}">${cellHtml(d,k)}</div>`).join("");
  }
  const cards=days.map((d,i)=>`<div class="dcard ${ymd(d)===today?"today":""}"><div class="dh"><span>${DAYS[i]} · ${fmtShort(d)}</span>${ymd(d)===today?"<span>Today</span>":""}</div>`+
    slots.map(([k,lbl])=>`<div class="sl"><div class="lb">${lbl}</div><div>${cellHtml(d,k)}</div></div>`).join("")+`</div>`).join("");
  const cnt=S.entries.length;
  m.innerHTML=noteHtml+`<div class="secbar"><span>1. Meal Plan</span><span class="r">${cnt} dish${cnt===1?"":"es"} · tap a dish to see the recipe</span></div><div class="grid">${g}</div><div class="daycards">${cards}</div>`;
}

/* shopping */
function buildShop(){
  const agg={};
  for(const e of S.entries){
    const r=e.recipe_id&&S.rmap[e.recipe_id]; if(!r) continue;
    const f=e.servings?e.servings/r.servings:1;
    for(const ing of (r.ingredients||[])){
      if(!ing.item) continue;
      const unit=(ing.unit||"").trim(), key=ing.item.trim().toLowerCase()+"|"+unit.toLowerCase();
      const a=agg[key]||(agg[key]={key,item:ing.item.trim(),unit,cat:SHOP_CATS.includes(ing.cat)?ing.cat:"Others",staple:!!ing.staple,sum:0,num:false,dishes:new Set()});
      const q=parseFloat(ing.qty);
      if(!isNaN(q)){a.sum+=q*f;a.num=true;}
      a.dishes.add(r.name.replace(/\s*\(.*\)$/,""));
    }
  }
  const items=Object.values(agg);
  for(const x of S.extras) items.push({key:"x:"+x.id,item:x.item,unit:"",qtyText:x.qty||"",cat:SHOP_CATS.includes(x.category)?x.category:"Others",staple:false,extra:x.id,dishes:new Set()});
  return items;
}
function qtyText(a){ if(a.extra) return a.qtyText; return a.num?(fmtQty(a.sum)+" "+a.unit).trim():a.unit; }
function sitemHtml(a){
  const on=!!S.checks[a.key];
  return `<label class="sitem ${on?"done":""}"><input type="checkbox" ${on?"checked":""} data-key="${esc(a.key)}" onchange="toggleCheck(this,this.dataset.key)"><span class="t"><span class="n">${esc(a.item)}</span>${a.extra?' <span class="tag warn" style="font-size:10.5px;padding:0 5px">extra</span>':""}<span class="f">${a.dishes.size?esc([...a.dishes].join(", ")):""}</span></span><span class="q">${esc(qtyText(a))}</span>${S.isAdmin&&a.extra?`<button class="xdel" title="Delete" onclick="event.preventDefault();event.stopPropagation();delExtra('${a.extra}')">×</button>`:""}</label>`;
}
function renderShop(m){
  const items=buildShop();
  const buy=items.filter(a=>!a.staple), pantry=items.filter(a=>a.staple);
  const done=buy.filter(a=>S.checks[a.key]).length;
  const grp=list=>SHOP_CATS.map(c=>{const l=list.filter(a=>a.cat===c).sort((a,b)=>a.item.localeCompare(b.item));if(!l.length)return "";
    return `<div class="shopgrp"><div class="gt">${c}<span>${l.filter(a=>S.checks[a.key]).length}/${l.length}</span></div>${l.map(sitemHtml).join("")}</div>`;}).join("");
  const pct=buy.length?Math.round(done/buy.length*100):0;
  let h=`<div class="secbar"><span>2. To Buy</span><span class="r">${done} / ${buy.length} bought</span></div>
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px"><div class="progress"><i style="width:${pct}%"></i></div><span class="mono" style="font-size:12px;color:var(--muted)">${pct}%</span><button class="btn sm noprint" onclick="refreshWeek()">Refresh</button></div>`;
  h+=buy.length?`<div class="shopcols">${grp(buy)}</div>`:'<p class="empty">No dishes with recipes planned this week.</p>';
  if(S.isAdmin) h+=`<div class="extraform"><input id="exItem" placeholder="Extra item (e.g. Milk)"><input id="exQty" placeholder="Qty (e.g. 1 L)" style="width:120px"><select id="exCat">${SHOP_CATS.map(c=>`<option ${c==="Others"?"selected":""}>${c}</option>`).join("")}</select><button class="btn sm primary" onclick="addExtra()">Add item</button></div>`;
  h+=`<div class="secbar"><span>3. Pantry — check stock before shopping</span><span class="r">sauces &amp; basics used this week</span></div>`;
  h+=pantry.length?`<div class="shopcols">${grp(pantry)}</div>`:'<p class="empty">None.</p>';
  m.innerHTML=h;
}
async function toggleCheck(el,key){
  const val=el.checked; S.checks[key]=val; el.closest(".sitem").classList.toggle("done",val);
  const {error}=await sb.rpc("set_meal_shopping_check",{p_week:ymd(S.week),p_key:key,p_checked:val});
  if(error){ toast("Not saved: "+error.message); S.checks[key]=!val; }
  render();
}
async function addExtra(){
  const item=document.getElementById("exItem").value.trim(); if(!item) return;
  const {error}=await sb.from("meal_shopping_extras").insert({week_start:ymd(S.week),item,qty:document.getElementById("exQty").value.trim()||null,category:document.getElementById("exCat").value});
  if(error) return toast(error.message);
  await refreshWeek();
}
async function delExtra(id){
  const {error}=await sb.from("meal_shopping_extras").delete().eq("id",id);
  if(error) return toast(error.message);
  await refreshWeek();
}

/* recipes */
function renderRecipes(m){
  const q=S.rSearch.toLowerCase();
  const list=S.recipes.filter(r=>(S.rCat==="All"||r.category===S.rCat)&&(!q||r.name.toLowerCase().includes(q)||(r.ingredients||[]).some(i=>(i.item||"").toLowerCase().includes(q))));
  const used=["All",...CATS.filter(c=>S.recipes.some(r=>r.category===c))];
  m.innerHTML=`<div class="secbar"><span>4. Recipes</span><span class="r">${S.recipes.length} recipes</span></div>
    <div class="rfilter"><input id="rSearch" placeholder="Search dish or ingredient…" value="${esc(S.rSearch)}">${used.map(c=>`<button class="pill ${c===S.rCat?"on":""}" data-c="${esc(c)}">${esc(c)}</button>`).join("")}
    ${S.isAdmin?'<span style="flex:1"></span><button class="btn primary sm" onclick="openRecipeEdit()">+ New recipe</button>':""}</div>
    <div class="rgrid">${list.map(r=>`<div class="rcard" onclick="openRecipe('${r.id}')"><span class="n">${esc(r.name)}</span><span class="m">${esc(r.category)} · Serves ${r.servings}${totalMin(r)?" · "+totalMin(r)+" min":""}</span><span class="m">${(r.ingredients||[]).filter(i=>!i.staple).slice(0,4).map(i=>esc(i.item)).join(", ")}</span></div>`).join("")||'<p class="empty">No recipes found.</p>'}</div>`;
  const s=document.getElementById("rSearch");
  s.oninput=()=>{S.rSearch=s.value;const p=s.selectionStart;renderRecipes(m);const n=document.getElementById("rSearch");n.focus();n.setSelectionRange(p,p);};
  m.querySelectorAll(".pill").forEach(b=>b.onclick=()=>{S.rCat=b.dataset.c;renderRecipes(m);});
}
function openRecipe(id){
  const r=S.rmap[id]; if(!r) return;
  const ings=(r.ingredients||[]);
  const body=`<div class="meta"><span class="tag ok">${esc(r.category)}</span><span class="tag warn">Serves ${r.servings}</span>${r.prep_min?`<span class="tag warn">Prep ${r.prep_min} min</span>`:""}${r.cook_min?`<span class="tag warn">Cook ${r.cook_min} min</span>`:""}</div>
    <div class="subh">Ingredients</div>
    <table class="t"><tr><th>Ingredient</th><th style="width:130px">Amount</th></tr>${ings.map(i=>`<tr><td>${esc(i.item)}${i.staple?' <span style="color:var(--muted);font-size:11.5px">(pantry)</span>':""}</td><td class="q">${esc((fmtQty(i.qty)+" "+(i.unit||"")).trim())}</td></tr>`).join("")}</table>
    <div class="subh">Steps</div><ol class="steps">${(r.steps||[]).map(s=>`<li>${esc(s)}</li>`).join("")}</ol>
    ${r.notes?`<div class="notebox" style="margin-top:12px"><div class="h">Tip</div>${esc(r.notes)}</div>`:""}`;
  openModal(r.name,body,S.isAdmin?`<button class="btn danger" onclick="delRecipe('${r.id}')">Delete</button><button class="btn primary" onclick="openRecipeEdit('${r.id}')">Edit</button>`:"");
}
function ingRow(i={}){
  return `<div class="ingrow"><input class="ii" placeholder="Ingredient" value="${esc(i.item||"")}"><input class="iq" placeholder="Qty" value="${esc(i.qty??"")}"><input class="iu" placeholder="Unit" value="${esc(i.unit||"")}"><select class="ic">${SHOP_CATS.map(c=>`<option ${c===(i.cat||"Others")?"selected":""}>${c}</option>`).join("")}</select><label class="pc"><input type="checkbox" class="is" ${i.staple?"checked":""}>Pantry</label><button class="btn sm" onclick="this.parentNode.remove()" title="Remove">×</button></div>`;
}
function openRecipeEdit(id){
  const r=id?S.rmap[id]:{name:"",category:"Main",servings:1,prep_min:"",cook_min:"",ingredients:[],steps:[],notes:""};
  const body=`<div class="form">
    <label>Dish name</label><input id="reName" value="${esc(r.name)}">
    <div class="row" style="grid-template-columns:2fr 1fr 1fr 1fr">
      <div><label>Category</label><select id="reCat">${CATS.map(c=>`<option ${c===r.category?"selected":""}>${c}</option>`).join("")}</select></div>
      <div><label>Serves</label><input id="reSv" type="number" min="1" value="${esc(r.servings)}"></div>
      <div><label>Prep (min)</label><input id="rePrep" type="number" min="0" value="${esc(r.prep_min??"")}"></div>
      <div><label>Cook (min)</label><input id="reCook" type="number" min="0" value="${esc(r.cook_min??"")}"></div>
    </div>
    <label>Ingredients <span style="font-size:11px">(tick "Pantry" for sauces/basics usually in stock)</span></label>
    <div id="ingList">${(r.ingredients.length?r.ingredients:[{}]).map(ingRow).join("")}</div>
    <button class="btn sm" onclick="document.getElementById('ingList').insertAdjacentHTML('beforeend',ingRow())">+ Add ingredient</button>
    <label>Steps (one step per line)</label><textarea id="reSteps">${esc((r.steps||[]).join("\n"))}</textarea>
    <label>Tip / notes</label><input id="reNotes" value="${esc(r.notes||"")}">
    <div class="msg" id="reMsg"></div></div>`;
  openModal(id?"Edit recipe":"New recipe",body,`<button class="btn" onclick="${id?`openRecipe('${id}')`:"closeModal()"}">Cancel</button><button class="btn primary" onclick="saveRecipe(${id?`'${id}'`:"null"})">Save recipe</button>`);
}
async function saveRecipe(id){
  const v=x=>document.getElementById(x).value;
  const name=v("reName").trim(); if(!name){document.getElementById("reMsg").innerHTML='<span class="tag bad">Dish name needed</span>';return;}
  const ingredients=[...document.querySelectorAll("#ingList .ingrow")].map(row=>{
    const qRaw=row.querySelector(".iq").value.trim(), qn=Number(qRaw);
    return {item:row.querySelector(".ii").value.trim(),qty:qRaw===""?"":(isNaN(qn)?qRaw:qn),unit:row.querySelector(".iu").value.trim(),cat:row.querySelector(".ic").value,...(row.querySelector(".is").checked?{staple:true}:{})};
  }).filter(i=>i.item);
  const rec={name,category:v("reCat"),servings:Math.max(1,parseInt(v("reSv"))||1),prep_min:v("rePrep")===""?null:parseInt(v("rePrep")),cook_min:v("reCook")===""?null:parseInt(v("reCook")),
    ingredients,steps:v("reSteps").split("\n").map(s=>s.trim()).filter(Boolean),notes:v("reNotes").trim()||null,updated_at:new Date().toISOString()};
  const q=id?sb.from("meal_recipes").update(rec).eq("id",id).select().single():sb.from("meal_recipes").insert(rec).select().single();
  const {data,error}=await q;
  if(error){document.getElementById("reMsg").innerHTML='<span class="tag bad">'+esc(error.message)+'</span>';return;}
  await loadRecipes(); render(); openRecipe(data.id); toast("Recipe saved");
}
function delRecipe(id){
  const r=S.rmap[id], uses=S.entries.filter(e=>e.recipe_id===id).length;
  openModal("Delete recipe",`<p>Delete <b>${esc(r.name)}</b>? This cannot be undone.${uses?` It is used ${uses} time(s) this week — those dishes will show as untitled.`:""}</p>`,
    `<button class="btn" onclick="openRecipe('${id}')">Cancel</button><button class="btn danger" id="delGo">Delete</button>`);
  document.getElementById("delGo").onclick=async()=>{
    const {error}=await sb.from("meal_recipes").delete().eq("id",id);
    if(error) return toast(error.message);
    closeModal(); await loadAll(); toast("Recipe deleted");
  };
}

/* plan edits */
function openAddEntry(date,slot){
  const d=parseYmd(date), lbl=SLOTS.find(s=>s[0]===slot)[1];
  const opts=CATS.map(c=>{const l=S.recipes.filter(r=>r.category===c);return l.length?`<optgroup label="${esc(c)}">${l.map(r=>`<option value="${r.id}">${esc(r.name)}</option>`).join("")}</optgroup>`:"";}).join("");
  openModal(`Add to ${DAYS[d.getDay()]} ${fmtShort(d)} · ${lbl}`,`<div class="form">
    <label>Recipe</label><select id="aeR"><option value="">— no recipe (type a name below) —</option>${opts}</select>
    <label>Or dish name without recipe</label><input id="aeT" placeholder="e.g. Fruit, Leftovers, Eat out">
    <div class="row" style="grid-template-columns:1fr 3fr"><div><label>Servings (optional)</label><input id="aeS" type="number" min="1"></div><div><label>Note for cook (optional)</label><input id="aeN" placeholder="e.g. less spicy"></div></div>
    <div class="msg" id="aeMsg"></div></div>`,
    `<span></span><button class="btn primary" id="aeGo">Add</button>`);
  document.getElementById("aeGo").onclick=async()=>{
    const recipe_id=document.getElementById("aeR").value||null, title=document.getElementById("aeT").value.trim()||null;
    if(!recipe_id&&!title){document.getElementById("aeMsg").innerHTML='<span class="tag bad">Choose a recipe or type a name</span>';return;}
    const sort=S.entries.filter(e=>e.meal_date===date&&e.slot===slot).length;
    const s=parseInt(document.getElementById("aeS").value);
    const {error}=await sb.from("meal_entries").insert({meal_date:date,slot,recipe_id,title:recipe_id?null:title,servings:isNaN(s)?null:s,note:document.getElementById("aeN").value.trim()||null,sort});
    if(error) return toast(error.message);
    closeModal(); await refreshWeek();
  };
}
async function delEntry(id){
  const {error}=await sb.from("meal_entries").delete().eq("id",id);
  if(error) return toast(error.message);
  await refreshWeek();
}
async function saveNote(){
  const note=document.getElementById("wkNote").value.trim();
  const {error}=await sb.from("meal_week_notes").upsert({week_start:ymd(S.week),note,updated_at:new Date().toISOString()});
  if(error) return toast(error.message);
  toast("Note saved"); await refreshWeek();
}
async function copyPrevWeek(){
  const ps=ymd(addDays(S.week,-7)), pe=ymd(addDays(S.week,-1));
  const {data,error}=await sb.from("meal_entries").select("*").gte("meal_date",ps).lte("meal_date",pe);
  if(error) return toast(error.message);
  if(!data.length) return toast("Previous week has no plan.");
  const go=async()=>{
    const rows=data.map(e=>({meal_date:ymd(addDays(parseYmd(e.meal_date),7)),slot:e.slot,recipe_id:e.recipe_id,title:e.title,servings:e.servings,note:e.note,sort:e.sort}));
    const {error:e2}=await sb.from("meal_entries").insert(rows);
    if(e2) return toast(e2.message);
    closeModal(); toast(rows.length+" dishes copied"); await refreshWeek();
  };
  if(S.entries.length){
    openModal("Copy previous week",`<p>This week already has ${S.entries.length} dish(es). Copying will <b>add</b> ${data.length} more on top of them (nothing is deleted).</p>`,`<button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" id="cpGo">Copy anyway</button>`);
    document.getElementById("cpGo").onclick=go;
  } else go();
}

/* ---------- wiring ---------- */
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;history.replaceState(null,"","#"+S.tab);render();});
document.getElementById("prevW").onclick=()=>{S.week=addDays(S.week,-7);refreshWeek();};
document.getElementById("nextW").onclick=()=>{S.week=addDays(S.week,7);refreshWeek();};
document.getElementById("thisW").onclick=()=>{S.week=mondayOf(new Date());refreshWeek();};
document.getElementById("printBtn").onclick=()=>window.print();
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&S.loadedAt&&(Date.now()-S.loadedAt)>60000)refreshWeek();});
sb.auth.onAuthStateChange((ev)=>{if(ev==="SIGNED_OUT"){S.isAdmin=false;renderOwner();}});
const h=location.hash.replace("#",""); if(["plan","shopping","recipes"].includes(h)) S.tab=h;
(async()=>{ renderOwner(); await refreshAuth(); await loadAll(); })();
</script>
</body>
