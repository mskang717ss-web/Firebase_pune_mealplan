name: Setup Gemini (AI Logic)

# One-off helper, run by hand: enables the APIs Firebase AI Logic needs and
# shows whether the Firebase browser key is allowed to call them.
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PROJECT: meal-plan-e954d

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Auth
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SA" > "$RUNNER_TEMP/sa.json"
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/sa.json" --quiet
          gcloud config set project "$PROJECT" --quiet

      - name: Enable AI Logic + Gemini Developer API
        run: gcloud services enable firebasevertexai.googleapis.com generativelanguage.googleapis.com --project "$PROJECT"

      - name: Show API key restrictions (no key values)
        continue-on-error: true
        run: |
          gcloud services api-keys list --project "$PROJECT" \
            --format="table(displayName, restrictions.apiTargets.service.list(), restrictions.browserKeyRestrictions.allowedReferrers.list())"

      - name: Allow AI Logic on the Firebase browser key if it is restricted
        continue-on-error: true
        run: |
          gcloud services api-keys list --project "$PROJECT" --format=json > "$RUNNER_TEMP/keys.json"
          python3 - "$RUNNER_TEMP/keys.json" > "$RUNNER_TEMP/cmd.sh" <<'PY'
          import json, sys, shlex
          for k in json.load(open(sys.argv[1])):
              if "auto created by Firebase" not in k.get("displayName", ""):
                  continue
              targets = [t["service"] for t in k.get("restrictions", {}).get("apiTargets", [])]
              if not targets or "firebasevertexai.googleapis.com" in targets:
                  print("echo 'Key " + k["displayName"] + ": no change needed'")
                  continue
              targets.append("firebasevertexai.googleapis.com")
              args = " ".join("--api-target=service=" + shlex.quote(t) for t in targets)
              print("gcloud services api-keys update " + shlex.quote(k["name"]) + " " + args + " --quiet && echo 'Added AI Logic to " + k["displayName"] + "'")
          PY
          bash "$RUNNER_TEMP/cmd.sh"

      - name: Clean up
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json" "$RUNNER_TEMP/keys.json" "$RUNNER_TEMP/cmd.sh"
